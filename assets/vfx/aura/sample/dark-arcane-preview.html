<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Arcane Aura | Aura Fishing</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #0c0b14;
      color: #f3f1ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1100px, 100% - 32px); margin: clamp(20px, 4vh, 48px) auto; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    h1 { margin: 4px 0 0; font-size: clamp(26px, 5vw, 46px); line-height: 1.1; letter-spacing: -.035em; }
    .project { margin: 0; color: #bab1d6; font-size: 13px; }
    button {
      min-height: 44px;
      padding: 8px 14px;
      border: 1px solid #433954;
      border-radius: 9px;
      background: #171322;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #241d37; }
    button:disabled { opacity: .6; cursor: default; }
    button[aria-pressed="true"] { border-color: #9675ef; background: #2a1e44; }
    #toggle { flex-shrink: 0; font-size: 13px; }
    .stage {
      position: relative;
      height: clamp(300px, 67vh, 670px);
      overflow: hidden;
      border: 1px solid #382e49;
      border-radius: 16px;
      background: radial-gradient(ellipse at 50% 57%, #252244 0%, #151327 49%, #100e1b 83%);
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    canvas:focus-visible { outline: 2px solid #9675ef; outline-offset: -3px; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 16px; text-align: center; pointer-events: none; }
    #status[hidden] { display: none; }
    .hint { position: absolute; right: 16px; bottom: 12px; margin: 0; color: #c5bdd9; font-size: 12px; pointer-events: none; }
    .tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
    .tier { text-align: left; }
    .tier strong, .tier span { display: block; }
    .tier span { margin-top: 2px; color: #d4c8ee; font-size: 12px; }
    @media (max-width: 420px) { .stage { height: min(55vh, 440px); min-height: 270px; } .tier { padding-inline: 8px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="project">Aura Fishing</p>
        <h1>Dark Arcane Aura</h1>
      </div>
      <button type="button" id="toggle" disabled>พักภาพ</button>
    </header>
    <div class="stage">
      <canvas id="scene" tabindex="0" aria-label="ตัวอย่างออร่า Dark Arcane ลากหรือกดปุ่มลูกศรเพื่อหมุนมุมมอง"></canvas>
      <p id="status" role="status">กำลังโหลดภาพออร่า</p>
      <p class="hint" aria-hidden="true">ลากเพื่อหมุนมุมมอง</p>
    </div>
    <div class="tiers" role="group" aria-label="ระดับออร่า">
      <button type="button" class="tier" data-tier="1" aria-pressed="false" disabled><strong>Tier 1</strong><span>เปลวไฟและแฟลร์</span></button>
      <button type="button" class="tier" data-tier="2" aria-pressed="false" disabled><strong>Tier 2</strong><span>เพิ่มสะเก็ดสีม่วง</span></button>
      <button type="button" class="tier" data-tier="3" aria-pressed="true" disabled><strong>Tier 3</strong><span>เพิ่มวงโค้งโคจร</span></button>
    </div>
  </main>
  <script>
    const scene = document.getElementById('scene');
    const context = scene.getContext('2d');
    const status = document.getElementById('status');
    const toggle = document.getElementById('toggle');
    const tierButtons = [...document.querySelectorAll('[data-tier]')];
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let atlas;
    let tier = 3;
    let yaw = .38;
    let pitch = .38;
    let time = .42;
    let frameRequest;
    let lastTimestamp;
    let drag;

    function tint(image, color) {
      const canvas = document.createElement('canvas');
      canvas.width = Math.min(1024, image.naturalWidth);
      canvas.height = Math.round(image.naturalHeight * canvas.width / image.naturalWidth);
      const brush = canvas.getContext('2d');
      brush.drawImage(image, 0, 0, canvas.width, canvas.height);
      brush.globalCompositeOperation = 'multiply';
      brush.fillStyle = color;
      brush.fillRect(0, 0, canvas.width, canvas.height);
      brush.globalCompositeOperation = 'lighter';
      brush.filter = 'contrast(2.7) brightness(.7)';
      brush.drawImage(image, 0, 0, canvas.width, canvas.height);
      return canvas;
    }

    async function loadAtlas(path, grid, color) {
      const image = new Image();
      image.src = path;
      await image.decode();
      return { image, grid, energy: tint(image, color) };
    }

    function drawFrame(texture, grid, frame, width, height, anchor, opacity) {
      const cellWidth = texture.width / grid;
      const cellHeight = texture.height / grid;
      const margin = 2;
      context.globalAlpha = opacity;
      context.drawImage(texture,
        (frame % grid) * cellWidth + margin, Math.floor(frame / grid) * cellHeight + margin,
        cellWidth - 2 * margin, cellHeight - 2 * margin,
        -width / 2, -height * anchor, width, height
      );
    }

    function sprite(sheet, frame, width, height, options) {
      const { anchor = .5, opacity = 1, filter = 'none', texture = sheet.energy, blend = 'screen' } = options;
      const first = Math.floor(frame);
      const fraction = frame - first;
      context.globalCompositeOperation = blend;
      context.filter = filter;
      drawFrame(texture, sheet.grid, first, width, height, anchor, opacity * (1 - fraction));
      if (fraction > 0) {
        drawFrame(texture, sheet.grid, (first + 1) % (sheet.grid ** 2), width, height, anchor, opacity * fraction);
      }
    }

    function render() {
      if (!atlas) return;
      const density = Math.min(devicePixelRatio || 1, 1.75);
      const width = scene.clientWidth;
      const height = scene.clientHeight;
      const bufferWidth = Math.round(width * density);
      const bufferHeight = Math.round(height * density);
      if (scene.width !== bufferWidth || scene.height !== bufferHeight) {
        scene.width = bufferWidth;
        scene.height = bufferHeight;
      }
      context.setTransform(density, 0, 0, density, 0, 0);
      const background = context.createRadialGradient(width / 2, height * .57, 0,
        width / 2, height * .57, Math.max(width * .48, height * .7));
      background.addColorStop(0, '#252244');
      background.addColorStop(.58, '#151327');
      background.addColorStop(1, '#100e1b');
      context.fillStyle = background;
      context.fillRect(0, 0, width, height);

      const scale = Math.min(width / 5.15, height / 3.85);
      const auraSize = [1, 1.3, 1.34][tier - 1];
      const cosYaw = Math.cos(yaw);
      const sinYaw = Math.sin(yaw);
      const cosPitch = Math.cos(pitch);
      const sinPitch = Math.sin(pitch);

      function project(x, y, z) {
        const horizontal = x * cosYaw - z * sinYaw;
        const forward = x * sinYaw + z * cosYaw;
        const up = y - 1.1;
        const perspective = 8 / (8 - forward * cosPitch - up * sinPitch);
        return {
          x: width / 2 + horizontal * scale * perspective,
          y: height * .5 + (forward * sinPitch - up * cosPitch) * scale * perspective,
          size: scale * perspective,
        };
      }

      function billboard(sheet, frame, x, y, z, size, options = {}) {
        const point = project(x, y, z);
        context.save();
        context.translate(point.x, point.y);
        context.rotate(options.angle ?? 0);
        sprite(sheet, frame, size * point.size, size * point.size, options);
        context.restore();
      }

      function plane(sheet, frame, y, size, tilt, heading, spin, options = {}) {
        const origin = project(0, y, 0);
        const right = project(Math.cos(heading) * .1, y, Math.sin(heading) * .1);
        const down = project(-Math.sin(heading) * Math.cos(tilt) * .1,
          y + Math.sin(tilt) * .1, Math.cos(heading) * Math.cos(tilt) * .1);
        context.save();
        context.transform((right.x - origin.x) * 10, (right.y - origin.y) * 10,
          (down.x - origin.x) * 10, (down.y - origin.y) * 10, origin.x, origin.y);
        context.rotate(spin);
        sprite(sheet, frame, size, size, options);
        context.restore();
      }

      // The dark pass multiplies the scene with an inverted copy of the source art.
      const ink = { blend: 'multiply', filter: 'invert(1) contrast(1.15)', opacity: .48 };
      const flameFrame = (time * (tier === 1 ? 18 : 21)) % 16;
      const groundFrame = time * 15 % 16;
      const glowStrength = tier === 3 ? .75 : .48;
      context.beginPath();
      for (let line = -3; line <= 3; line += 1) {
        const near = project(line * .65, 0, -2.15);
        const far = project(line * .65, 0, 2.15);
        const left = project(-2.15, 0, line * .65);
        const right = project(2.15, 0, line * .65);
        context.moveTo(near.x, near.y);
        context.lineTo(far.x, far.y);
        context.moveTo(left.x, left.y);
        context.lineTo(right.x, right.y);
      }
      context.strokeStyle = 'rgba(175, 166, 229, .14)';
      context.stroke();

      // Screen blending leaves the black atlas backgrounds out of the composite.
      plane(atlas.ground, groundFrame, 0, 3.65 * auraSize, 0, .36, time * .2,
        { ...ink, texture: atlas.ground.image });
      plane(atlas.ground, groundFrame, .015, 3.35 * auraSize, 0, .36, time * .2,
        { filter: 'blur(8px)', opacity: glowStrength });
      plane(atlas.ground, groundFrame, .015, 3.35 * auraSize, 0, .36, time * .2, { opacity: .87 });

      if (tier === 3) {
        plane(atlas.orbit, (time * 9 + 4) % 16, 1.2, 2.95 * auraSize, -.68, time * -.72, time * .62,
          { opacity: .66 });
      }
      billboard(atlas.flame, flameFrame, 0, .02, 0, 2.67 * auraSize,
        { ...ink, texture: atlas.flame.image, anchor: .88 });
      billboard(atlas.flame, flameFrame, 0, .02, 0, 2.42 * auraSize,
        { anchor: .88, filter: 'blur(13px)', opacity: glowStrength });
      billboard(atlas.flame, (flameFrame + 7) % 16, -.12, .02, -.2, 2.08 * auraSize,
        { anchor: .88, opacity: .38 });
      billboard(atlas.flame, flameFrame, 0, .02, 0, 2.42 * auraSize, { anchor: .88 });
      billboard(atlas.sparks, 0, 0, .37, .02, (.57 + .05 * Math.sin(time * 5)) * auraSize,
        { filter: 'blur(6px)', opacity: .66 });

      for (let index = 0; index < 5; index += 1) {
        const phase = (time / (.85 + index * .11) + index * .38) % 1;
        if (phase >= .48) continue;
        const angle = index * 2.4 + time * .38;
        const radius = (.45 + (index % 3) * .24) * auraSize;
        billboard(atlas.flare, phase / .48 * 15, Math.cos(angle) * radius, .49 + index * .33,
          Math.sin(angle) * radius, .44 * auraSize, { angle: index * .4, opacity: .9 });
      }

      if (tier >= 2) {
        const count = tier === 3 ? 23 : 16;
        for (let index = 0; index < count; index += 1) {
          const age = (time / (.72 + (index % 8) * .115) + index * .618) % 1;
          const angle = index * 2.4 + age * .4;
          const radius = (.3 + 1.3 * (1 - (1 - age) ** 2)) * auraSize;
          const y = .12 + age * (.76 + (index % 7) * .28);
          const size = (.15 + (index % 5) * .038) * auraSize;
          billboard(atlas.sparks, 1 + index % 3, Math.cos(angle) * radius, y, Math.sin(angle) * radius, size, {
            angle: angle + age * 1.5,
            opacity: Math.sin(age * Math.PI) * .92,
            texture: index % 5 < 2 ? atlas.magenta : atlas.sparks.energy,
          });
        }
      }
      if (tier === 3) {
        const orbitFrame = (time * 10 + 1.5) % 16;
        plane(atlas.orbit, orbitFrame, 1.08, 3.18 * auraSize, .64, time * .57 + 1.1, -time * .83,
          { filter: 'blur(10px)', opacity: .46 });
        plane(atlas.orbit, orbitFrame, 1.08, 3.18 * auraSize, .64, time * .57 + 1.1, -time * .83,
          { opacity: .89 });
      }
    }

    function tick(timestamp) {
      if (lastTimestamp !== undefined) time += Math.min(.05, (timestamp - lastTimestamp) / 1000);
      lastTimestamp = timestamp;
      render();
      frameRequest = requestAnimationFrame(tick);
    }

    function setPlaying(playing) {
      if (frameRequest !== undefined) cancelAnimationFrame(frameRequest);
      lastTimestamp = undefined;
      frameRequest = playing ? requestAnimationFrame(tick) : undefined;
      toggle.textContent = playing ? 'พักภาพ' : 'เล่นต่อ';
    }

    function rotate(deltaX, deltaY) {
      yaw += deltaX * .009;
      pitch = Math.max(.12, Math.min(.85, pitch + deltaY * .008));
      if (frameRequest === undefined) render();
    }

    scene.addEventListener('pointerdown', event => {
      if (event.button !== 0 || drag || !atlas) return;
      drag = { id: event.pointerId, x: event.clientX, y: event.clientY };
      scene.setPointerCapture(event.pointerId);
    });
    scene.addEventListener('pointermove', event => {
      if (event.pointerId !== drag?.id) return;
      rotate(event.clientX - drag.x, event.clientY - drag.y);
      drag.x = event.clientX;
      drag.y = event.clientY;
    });
    scene.addEventListener('lostpointercapture', () => { drag = undefined; });
    scene.addEventListener('keydown', event => {
      const directions = { ArrowLeft: [-12, 0], ArrowRight: [12, 0], ArrowUp: [0, -12], ArrowDown: [0, 12] };
      if (!directions[event.key]) return;
      event.preventDefault();
      rotate(...directions[event.key]);
    });
    toggle.addEventListener('click', () => setPlaying(frameRequest === undefined));
    reducedMotion.addEventListener('change', event => setPlaying(!event.matches && Boolean(atlas)));
    for (const button of tierButtons) {
      button.addEventListener('click', () => {
        tier = Number(button.dataset.tier);
        for (const control of tierButtons) control.setAttribute('aria-pressed', control === button);
        render();
      });
    }

    async function start() {
      const [flame, ground, orbit, flare, sparks] = await Promise.all([
        loadAtlas('01_core_wisps_4x4.png', 4, '#2e7bff'),
        loadAtlas('02_ground_burst_4x4.png', 4, '#2e7bff'),
        loadAtlas('03_orbital_arc_4x4.png', 4, '#1e6bff'),
        loadAtlas('04_star_flares_4x4.png', 4, '#80d4ff'),
        loadAtlas('05_sparks_atlas_2x2.png', 2, '#4d8cff'),
      ]);
      atlas = { flame, ground, orbit, flare, sparks, magenta: tint(sparks.image, '#ff4fd8') };
      status.hidden = true;
      toggle.disabled = false;
      for (const button of tierButtons) button.disabled = false;
      new ResizeObserver(render).observe(scene);
      render();
      setPlaying(!reducedMotion.matches);
    }

    start().catch(error => {
      status.textContent = 'โหลดภาพออร่าไม่ได้ กรุณาเปิดไฟล์ HTML จากโฟลเดอร์ sample เดิม';
      console.error(error);
    });
  </script>
</body>
</html>
